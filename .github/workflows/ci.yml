name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (sanity)
        run: npm run build

  star-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install development tools
        run: python -m pip install pytest==8.4.2 ruff==0.13.3
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Test aggregate analytics
        run: python -m pytest
      - name: Validate committed data and generate dashboard input
        run: python scripts/build_star_analytics.py
